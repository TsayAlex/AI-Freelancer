name: QA Automation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  qa-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run QA automation and save log
        run: |
          npx playwright test tests/broken-site.spec.js --reporter=list 2>&1 | tee QA_RUN_OUTPUT_NEW.txt

      - name: Generate QA reports
        run: node ./tests/generate-report.js

      - name: Upload QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-results
          path: |
            QA_RUN_OUTPUT_NEW.txt
            QA_TEST_REPORT.md
            QA_TEST_REPORT.html
            evidence/
            test-results/
          if-no-files-found: warn